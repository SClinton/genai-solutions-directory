<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (new URLSearchParams(location.search).get("embedded") === "1") {
    document.documentElement.classList.add("embedded");
  }
</script>
<title>GenAI Security Solutions — OWASP GenAI Security Project Solution Directory</title>
<meta name="description" content="A searchable database of generative AI security solutions.">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="../assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="../assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="concept-banner">
  ⚠️ Design concept only — this is a prototype, not an active or production application. Data may be incomplete or out of date.
</div>

<main class="wrap">
  <input id="search" type="search" placeholder="Search by name, company, or description…" aria-label="Search solutions">

  <div class="layout">
    <aside class="filters-sidebar">
      <h2 class="filters-heading">Filters</h2>
      <div id="facets-container"></div>
      <div class="active-filters" id="active-filters"></div>
    </aside>

    <div class="content">
      <p class="result-count" id="result-count"></p>

      <div class="sort-bar">
        <label class="sort-control">
          Sort:
          <select id="sort-select" aria-label="Sort solutions by name">
            <option value="asc">Name (A–Z)</option>
            <option value="desc">Name (Z–A)</option>
          </select>
        </label>
        <a class="btn btn-primary" href="add.html">+ Submit a Solution</a>
      </div>

      <section id="cards" class="cards" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>No solutions match your filters.</p>
    </div>
  </div>
</main>


<template id="card-template">
  <article class="card">
    <div class="card-head">
      <a class="card-edit-btn" title="Suggest an edit" aria-label="Suggest an edit">
        <span aria-hidden="true">✎</span>
      </a>
      <div class="card-header-stage-row">
        <span class="card-header-stage-label">Stage:</span>
        <div class="card-header-stage"></div>
      </div>
    </div>
    <div class="card-title-group">
      <div class="card-title-top-row">
        <div class="card-type-badge"></div>
        <img class="card-sponsor-badge" alt="" hidden>
      </div>
      <h2 class="card-title"></h2>
      <span class="card-company"></span>
    </div>
    <p class="card-description"></p>
    <div class="card-tag-rows"></div>
    <details class="card-details">
      <summary>Taxonomy Coverage</summary>
      <div class="card-coverage"></div>
    </details>
    <div class="card-footer">
      <a class="card-link" target="_blank" rel="noopener noreferrer">Visit site ↗</a>
      <div class="card-footer-meta">
        <span class="card-stat card-stat-stars" title="GitHub stars">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
          <span class="card-stat-value" data-stat="stars"></span>
        </span>
        <span class="card-stat card-stat-forks" title="GitHub forks">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>
          <span class="card-stat-value" data-stat="forks"></span>
        </span>
      </div>
      <span class="card-version" title="Version history"></span>
    </div>
  </article>
</template>

<script src="db.config.js"></script>
<script src="../shared/site.js"></script>
</body>
</html>
